[package]
name = "swolemate-server"
version = "2.4.1"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4"] }
futures-util = "0.3"
urlencoding = "2.1"
tar = "0.4"
flate2 = "1.0"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
url = "2.5"

[dev-dependencies]
actix-http = "3.9"
once_cell = "1.19"
tempfile = "3.10"
