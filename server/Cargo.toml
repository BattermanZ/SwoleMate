[package]
name = "swolemate-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4"] }
futures-util = "0.3"
urlencoding = "2.1"
tar = "0.4"
flate2 = "1.0"

[dev-dependencies]
actix-http = "3.9"
once_cell = "1.19"
tempfile = "3.10"
