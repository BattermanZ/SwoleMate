version: '3.8'

services:
  client:
    image: swolemate-client:v0.5.0
    container_name: swolemate-client
    ports:
      - "2470:2470"  # Frontend port
    environment:
      - PUID=1035
      - PGID=100
    networks:
      - cinelink_default
    restart: unless-stopped
    depends_on:
      - server
        
  server:
    image: swolemate-server:v0.5.0
    container_name: swolemate-server
    expose:
      - "2469"  # Backend port
    volumes:
      - ./logs:/app/logs:rw
      - ./database:/app/database:rw
      - ./server.env:/app/server.env:ro
    environment:
      - TZ=Europe/Amsterdam
      - DATABASE_URL=sqlite:/app/database/swolemate.db
      - RUST_LOG=debug
      - SERVER_PORT=2469
      - RUST_BACKTRACE=1
    user: "${PUID}:${PGID}"
    networks:
      - cinelink_default
    restart: unless-stopped

networks:
  cinelink_default:
    external: true

volumes:
  database:
  logs: 