services:
  client:
    image: 192.168.31.233:5000/swolemate-client:latest
    container_name: swolemate-client
    ports:
      - "2470:2470"  # Frontend port
    networks:
      - cinelink_default
    restart: unless-stopped
    depends_on:
      - server
        
  server:
    image: 192.168.31.233:5000/swolemate-server:latest
    container_name: swolemate-server
    expose:  
      - 2469  # Backend port
    volumes:
      - ./logs:/app/logs
      - ./database:/app/database
      - ./backups:/app/backups
      - ./server.env:/app/server.env
    networks:
      - cinelink_default
    restart: unless-stopped

volumes:
  database:
  logs:

networks:
  cinelink_default:
    external: true 
