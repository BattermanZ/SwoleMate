<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- PWA meta tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="SwoleMate" />
		<meta name="theme-color" content="#1d4ed8" />

		<!-- PWA icons -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/pwa-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/pwa-512.png" />

		<!-- PWA manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					const dark = stored ? stored === 'dark' : prefersDark;
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
		</script>

		<style>
			/* Handle iOS safe areas */
			:root {
				--sat: env(safe-area-inset-top);
				--sab: env(safe-area-inset-bottom);
				--sal: env(safe-area-inset-left);
				--sar: env(safe-area-inset-right);
			}

			html {
				min-height: calc(100% + env(safe-area-inset-top));
				height: -webkit-fill-available;
				padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
					env(safe-area-inset-left);
			}

			body {
				min-height: 100vh;
				min-height: -webkit-fill-available;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				height: 100%;
			}

			/* Ensure content starts below the status bar */
			.app-shell-header {
				padding-top: max(0.5rem, env(safe-area-inset-top));
				padding-left: max(1rem, env(safe-area-inset-left));
				padding-right: max(1rem, env(safe-area-inset-right));
			}

			.app-content {
				padding-left: max(1rem, env(safe-area-inset-left));
				padding-right: max(1rem, env(safe-area-inset-right));
				padding-bottom: max(1rem, env(safe-area-inset-bottom));
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
				min-height: calc(
					-webkit-fill-available - env(safe-area-inset-top) - env(safe-area-inset-bottom)
				);
			}

			/* Fix for drawer positioning */
			.drawer-content {
				padding-top: env(safe-area-inset-top);
				padding-bottom: env(safe-area-inset-bottom);
				padding-right: env(safe-area-inset-right);
				height: 100vh;
				height: -webkit-fill-available;
			}

			/* Fix for iOS height */
			.app-shell {
				display: flex;
				flex-direction: column;
				min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
				min-height: calc(
					-webkit-fill-available - env(safe-area-inset-top) - env(safe-area-inset-bottom)
				);
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="rocket" class="bg-surface-50-900-token">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
