<!DOCTYPE html>
<html lang="en" class="dark">
	<head>

		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		
		<!-- PWA meta tags -->
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="SwoleMate">
		<meta name="theme-color" content="#1e1e1e">
		
		<!-- PWA icons -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192.png">
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/pwa-192.png">
		<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/pwa-512.png">
		
		<!-- PWA manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json">
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="sahara">
		<div style="display: contents">%sveltekit.body%</div>
