<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>

		<!-- PWA meta -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="SwoleMate" />
		<meta name="theme-color" content="#f3ece1" />

		<!-- PWA icons -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa-192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/pwa-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/pwa-512.png" />

		<!-- PWA manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- Fonts (preconnect + display=swap to avoid FOUT-blocking) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
		/>

		<!-- Theme bootstrap — runs before paint to avoid flash -->
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					const dark = stored ? stored === 'dark' : prefersDark;
					if (dark) {
						document.documentElement.setAttribute('data-theme', 'dark');
						document.documentElement.classList.add('dark');
					}
				} catch {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
