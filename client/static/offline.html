<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#020617" />
		<title>SwoleMate — Offline</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #0b1220;
				--card: rgba(255, 255, 255, 0.06);
				--text: rgba(255, 255, 255, 0.92);
				--muted: rgba(255, 255, 255, 0.72);
				--btn: rgba(255, 255, 255, 0.14);
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #f8fafc;
					--card: rgba(2, 6, 23, 0.06);
					--text: rgba(2, 6, 23, 0.92);
					--muted: rgba(2, 6, 23, 0.72);
					--btn: rgba(2, 6, 23, 0.1);
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				font-family:
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					sans-serif;
				color: var(--text);
				padding: 24px;
				box-sizing: border-box;
			}
			.card {
				width: min(520px, 100%);
				background: var(--card);
				border-radius: 16px;
				padding: 20px;
				backdrop-filter: blur(12px);
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 20px;
			}
			p {
				margin: 0 0 16px;
				color: var(--muted);
				line-height: 1.4;
			}
			.actions {
				display: flex;
				gap: 10px;
				flex-wrap: wrap;
			}
			a,
			button {
				appearance: none;
				border: 0;
				border-radius: 12px;
				padding: 10px 12px;
				font-weight: 600;
				background: var(--btn);
				color: inherit;
				text-decoration: none;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>You're offline</h1>
			<p>
				If you opened SwoleMate at least once while online, it should still work offline. Try
				reloading.
			</p>
			<div class="actions">
				<button type="button" onclick="location.reload()">Reload</button>
				<a href="/">Go to Today</a>
			</div>
		</div>
	</body>
</html>
